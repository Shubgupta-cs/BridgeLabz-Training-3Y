<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Curated Nature Gallery</h1>
        <div class="gallery">
            <figure class="photo-card">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Yosemite Valley">
                <figcaption class="caption">Yosemite Valley, California</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Misty Forest">
                <figcaption class="caption">Misty Pine Forest</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Tropical Coast">
                <figcaption class="caption">Turquoise Ocean Shore</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80" alt="Snowy Peaks">
                <figcaption class="caption">Alpine Mountain Ridge</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=600&q=80" alt="Autumn Woods">
                <figcaption class="caption">Sunlit Woodland Trail</figcaption>
            </figure>
            <figure class="photo-card">
                <img src="https://images.unsplash.com/photo-1426604966848-d7adac902bff?auto=format&fit=crop&w=600&q=80" alt="Green Meadow">
                <figcaption class="caption">Emerald Valley Meadows</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
