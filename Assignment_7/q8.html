<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
    <main class="box-model-container">
        <div class="outer-margin-layer">
            <span class="layer-tag">Margin Layer</span>
            <div class="outer-border-layer">
                <span class="layer-tag">Border Layer</span>
                <div class="inner-padding-layer">
                    <span class="layer-tag">Padding Layer</span>
                    <div class="content-layer">
                        <span>Content Area</span>
                    </div>
                </div>
            </div>
        </div>
        <p class="description">Visual breakdown representation showing Content, Padding, Border, and Margin levels explicitly.</p>
    </main>
</body>
</html>
