<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <main class="transform-container">
        <div class="transform-wrapper">
            <div class="box rotate-box"></div>
            <span class="label">rotate(45deg)</span>
        </div>
        <div class="transform-wrapper">
            <div class="box scale-box"></div>
            <span class="label">scale(1.2)</span>
        </div>
        <div class="transform-wrapper">
            <div class="box translate-box"></div>
            <span class="label">translateY(-15px)</span>
        </div>
        <div class="transform-wrapper">
            <div class="box skew-box"></div>
            <span class="label">skew(15deg)</span>
        </div>
    </main>
</body>
</html>
