<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Nature Photography Showcase</h1>
    </header>
    <main>
        <div class="gallery">
            <figure>
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Yosemite Valley">
                </div>
                <figcaption>Yosemite Valley</figcaption>
            </figure>
            <figure>
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Misty Forest">
                </div>
                <figcaption>Misty Forest</figcaption>
            </figure>
            <figure>
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Tropical Coast">
                </div>
                <figcaption>Tropical Coast</figcaption>
            </figure>
            <figure>
                <div class="img-wrapper">
                    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80" alt="Alpine Ridge">
                </div>
                <figcaption>Alpine Ridge</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
