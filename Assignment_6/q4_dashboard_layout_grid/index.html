<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Enterprise Analytics Dashboard</h1>
        </header>

        <aside class="sidebar">
            <nav>
                <a href="#">Overview</a>
                <a href="#">Revenue</a>
                <a href="#">Customers</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="box span-two">
                <h2>Monthly Revenue Overview</h2>
                <p>Total revenue increased by 24.5% compared to the previous quarter across all product tiers.</p>
            </div>
            <div class="box">
                <h2>Active Users</h2>
                <p>18,420 daily active sessions</p>
            </div>
            <div class="box">
                <h2>Conversion Rate</h2>
                <p>4.82% checkout completion</p>
            </div>
        </main>
    </div>
</body>
</html>
