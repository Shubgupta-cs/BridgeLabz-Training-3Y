<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Form</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name" required>

        <input type="submit" value="Submit">

    </form>

    <br>

    <iframe
        src=""
        name="resultFrame"
        width="500"
        height="150"
        title="Form Result">
    </iframe>

</body>
</html>
