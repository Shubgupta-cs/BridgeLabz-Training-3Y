<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Entities</title>
</head>
<body>

    <h1>HTML Entities</h1>

    <p>
        Less than: &lt;<br>
        Greater than: &gt;<br>
        Ampersand: &amp;<br>
        Double quotation mark: &quot;<br>
        Single quotation mark: &apos;<br>
        Copyright: &copy;<br>
        Trademark: &trade;<br>
        Registered trademark: &reg;
    </p>

</body>
</html>
