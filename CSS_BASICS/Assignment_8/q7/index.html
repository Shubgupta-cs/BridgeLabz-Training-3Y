<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Components Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="ui-wrapper">
        <div class="card-container">
            <h2>Dashboard Elements</h2>
            <div class="component">
                <input type="search" placeholder="Search data..." class="search-bar">
            </div>
            <div class="component">
                <button class="ui-btn">Submit Action</button>
            </div>
            <div class="component">
                <select class="dropdown">
                    <option>Select Option</option>
                    <option>Option 1</option>
                    <option>Option 2</option>
                </select>
            </div>
        </div>
    </main>
</body>
</html>
