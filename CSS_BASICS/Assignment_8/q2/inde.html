<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="tooltip-container">
        <div class="tooltip-wrapper">
            <span class="tooltip-target">Hover over me (Word)</span>
            <span class="tooltip-text">This is a smooth CSS tooltip!</span>
        </div>
        <div class="tooltip-wrapper">
            <button class="tooltip-target">Hover Button</button>
            <span class="tooltip-text">Information saved securely.</span>
        </div>
    </main>
</body>
</html>
