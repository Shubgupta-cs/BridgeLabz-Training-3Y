<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Image Showcase</h1>
        <div class="grid-container">
            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1015/300/200" alt="Landscape 1">
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>
            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1025/300/200" alt="Animal">
                </div>
                <figcaption>Cute Puppy</figcaption>
            </figure>
            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1035/300/200" alt="Nature">
                </div>
                <figcaption>Autumn Forest</figcaption>
            </figure>
            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1043/300/200" alt="Architecture">
                </div>
                <figcaption>City Bridge</figcaption>
            </figure>
            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1050/300/200" alt="Water">
                </div>
                <figcaption>Ocean Coast</figcaption>
            </figure>
            <figure class="image-card">
                <div class="img-wrapper">
                    <img src="https://picsum.photos/id/1062/300/200" alt="Road">
                </div>
                <figcaption>Long Highway</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
