<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Sizing Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="comparison-container">
        <h1>Box-Sizing Comparison</h1>
        <div class="boxes-wrapper">
            <div class="box content-box">
                <h3>content-box</h3>
                <p>Width includes only content. Padding adds extra to total dimension.</p>
            </div>
            <div class="box border-box">
                <h3>border-box</h3>
                <p>Width includes content, padding, and borders within the set width.</p>
            </div>
        </div>
    </main>
</body>
</html>
