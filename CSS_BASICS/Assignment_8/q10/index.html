<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <header class="app-header">
            <h2>App Dashboard</h2>
        </header>
        <main class="app-main">
            <div class="content-card">
                <img src="https://picsum.photos/id/1/260/140" alt="Sample thumbnail" class="card-img">
                <form class="card-form">
                    <input type="text" placeholder="Enter username" class="form-input">
                    <button type="submit" class="form-btn">Update Profile</button>
                </form>
            </div>
        </main>
        <footer class="app-footer">
            <p>&copy; 2026 Webcafe Layout</p>
        </footer>
    </div>
</body>
</html>
