<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demo</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <main class="container">
        <div class="box solid-box">
            <h3>Solid Border</h3>
            <p>This box has a solid border and custom padding.</p>
        </div>
        <div class="box dashed-box">
            <h3>Dashed Border</h3>
            <p>This box features a dashed border style.</p>
        </div>
        <div class="box double-box">
            <h3>Double Border</h3>
            <p>This box showcases a double border look.</p>
        </div>
        <div class="box groove-box">
            <h3>Groove Border</h3>
            <p>This box utilizes a grooved border style.</p>
        </div>
    </main>
</body>
</html>
