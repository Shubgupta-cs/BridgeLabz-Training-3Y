<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background Page</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header class="fixed-header">
        <h1>CSS Gradients Showcase</h1>
    </header>
    
    <main class="content-container">
        <section class="gradient-section linear-bg">
            <div class="card-content">
                <h2>Linear Gradient Section</h2>
                <p>This section features a smooth linear color transition from top-left to bottom-right.</p>
            </div>
        </section>

        <section class="gradient-section radial-bg">
            <div class="card-content">
                <h2>Radial Gradient Section (Parallax Effect)</h2>
                <p>This section implements a radial gradient background with a fixed attachment property.</p>
            </div>
        </section>
    </main>

    <footer class="fixed-footer">
        <p>&copy; 2026 Gradient Layout Design</p>
    </footer>
</body>
</html>
