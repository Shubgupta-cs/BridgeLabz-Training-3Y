<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Us</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>


    <main class="contact-page">


        <form class="contact-form">

            <h1>Contact Us</h1>

            <p>
                We would love to hear from you.
            </p>


            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="subject">
                Subject
            </label>

            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Enter subject"
            >


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Write your message"
            ></textarea>


            <button type="submit">
                Send Message
            </button>

        </form>


    </main>


</body>
</html>
