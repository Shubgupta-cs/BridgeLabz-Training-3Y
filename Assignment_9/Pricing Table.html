<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pricing Plans</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>


    <main class="pricing">

        <h1>Choose Your Plan</h1>


        <section class="plans">


            <!-- Basic -->

            <article class="plan">

                <h2>Basic</h2>

                <div class="price">
                    ₹199
                    <span>/month</span>
                </div>

                <ul>
                    <li>5 Projects</li>
                    <li>Basic Support</li>
                    <li>1 GB Storage</li>
                </ul>

                <a href="#">
                    Get Started
                </a>

            </article>


            <!-- Standard -->

            <article class="plan popular">

                <p class="badge">
                    MOST POPULAR
                </p>

                <h2>Standard</h2>

                <div class="price">
                    ₹499
                    <span>/month</span>
                </div>

                <ul>
                    <li>20 Projects</li>
                    <li>Priority Support</li>
                    <li>10 GB Storage</li>
                </ul>

                <a href="#">
                    Choose Standard
                </a>

            </article>


            <!-- Premium -->

            <article class="plan">

                <h2>Premium</h2>

                <div class="price">
                    ₹999
                    <span>/month</span>
                </div>

                <ul>
                    <li>Unlimited Projects</li>
                    <li>24/7 Support</li>
                    <li>100 GB Storage</li>
                </ul>

                <a href="#">
                    Go Premium
                </a>

            </article>


        </section>

    </main>


</body>
</html>
