<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Photo Gallery</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>


    <main>

        <h1>Travel Gallery</h1>


        <section class="gallery">


            <figure class="photo">

                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80"
                    alt="Mountain landscape"
                >

                <figcaption>
                    Mountain Escape
                </figcaption>

            </figure>


            <figure class="photo">

                <img
                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80"
                    alt="Beach"
                >

                <figcaption>
                    Sunny Beach
                </figcaption>

            </figure>


            <figure class="photo">

                <img
                    src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=700&q=80"
                    alt="City street"
                >

                <figcaption>
                    City Life
                </figcaption>

            </figure>


            <figure class="photo">

                <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80"
                    alt="Lake and mountains"
                >

                <figcaption>
                    Peaceful Lake
                </figcaption>

            </figure>


            <figure class="photo">

                <img
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80"
                    alt="Road through landscape"
                >

                <figcaption>
                    Open Road
                </figcaption>

            </figure>


            <figure class="photo">

                <img
                    src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=700&q=80"
                    alt="Forest"
                >

                <figcaption>
                    Forest Trail
                </figcaption>

            </figure>


        </section>

    </main>


</body>
</html>
