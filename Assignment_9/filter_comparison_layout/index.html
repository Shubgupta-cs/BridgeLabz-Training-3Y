<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter_comparison_layout.css">
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Image Filter Comparison</h1>
            <p>Hover over the right image to remove the active CSS filter.</p>
        </header>

        <div class="comparison-wrapper">
            <figure class="image-box">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=600&q=80" alt="Original Landscape">
                <figcaption>Original Image</figcaption>
            </figure>
            <figure class="image-box">
                <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=600&q=80" alt="Filtered Landscape" class="filtered-image">
                <figcaption>Filtered Image (Contrast & Brightness)</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
