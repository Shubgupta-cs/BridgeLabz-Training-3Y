<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
    <header>
        <h1>CSS Filter Gallery</h1>
        <p>Hover over any image to reveal its original state.</p>
    </header>
    <main>
        <div class="gallery-grid">
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80" alt="Mountain Landscape" class="img-blur">
                <figcaption>Blur Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" alt="Tropical Beach" class="img-grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=600&q=80" alt="Forest Pathway" class="img-sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=600&q=80" alt="Misty Pines" class="img-brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80" alt="Snowy Peak" class="img-contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1426604966848-d7adac902bff?auto=format&fit=crop&w=600&q=80" alt="Vibrant Valley" class="img-hue">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>
        </div>
    </main>
</body>
</html>
