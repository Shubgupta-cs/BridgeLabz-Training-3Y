<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                        <h3 class="h5 m-0 fw-bold">Project Task Board</h3>
                        <span class="badge bg-warning text-dark fs-6">4 Pending</span>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span>Configure OAuth2 Authentication endpoints</span>
                            <div>
                                <span class="badge bg-danger me-2">High</span>
                                <button class="btn btn-outline-success btn-sm">Completed <span class="badge bg-success ms-1">✓</span></button>
                            </div>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span>Refactor payment gateway webhook handler</span>
                            <div>
                                <span class="badge bg-warning text-dark me-2">Medium</span>
                                <button class="btn btn-outline-success btn-sm">Completed <span class="badge bg-success ms-1">✓</span></button>
                            </div>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span>Optimize hero section image assets</span>
                            <div>
                                <span class="badge bg-info text-dark me-2">Low</span>
                                <button class="btn btn-outline-success btn-sm">Completed <span class="badge bg-success ms-1">✓</span></button>
                            </div>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <span>Write unit tests for checkout service</span>
                            <div>
                                <span class="badge bg-danger me-2">High</span>
                                <button class="btn btn-outline-success btn-sm">Completed <span class="badge bg-success ms-1">✓</span></button>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
