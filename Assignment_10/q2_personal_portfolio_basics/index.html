<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarav Sharma - Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">
    <header class="container text-center py-5">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Profile Picture" class="profile-img img-fluid rounded-circle mb-3 shadow">
        <h1 class="fw-bold display-5">Aarav Sharma</h1>
        <p class="lead text-muted">Full-Stack Software Engineer & UI/UX Designer</p>
        <div class="mt-4">
            <a href="#" class="btn btn-dark btn-lg me-2 mb-2">Hire Me</a>
            <a href="#" class="btn btn-outline-dark btn-lg mb-2">Download CV</a>
        </div>
    </header>

    <main class="container mb-5">
        <section class="row justify-content-center">
            <div class="col-md-6 bg-white p-5 rounded shadow-sm">
                <h3 class="fw-bold mb-4 text-center">Get in Touch</h3>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Type your message here..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
