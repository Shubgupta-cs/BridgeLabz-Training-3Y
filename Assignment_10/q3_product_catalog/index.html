<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-5">
        <h2 class="text-center fw-bold mb-5">Featured Products</h2>
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card border-0">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Smart Watch">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Smart Watch Pro</h5>
                        <p class="card-text text-muted">₹12,999</p>
                        <button class="btn btn-outline-primary mt-auto">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card border-0">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Headphones">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="card-text text-muted">₹4,499</p>
                        <button class="btn btn-outline-primary mt-auto">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card border-0">
                    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Camera">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Retro DSLR Camera</h5>
                        <p class="card-text text-muted">₹45,000</p>
                        <button class="btn btn-outline-primary mt-auto">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card h-100 shadow-sm product-card border-0">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Running Shoes">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Sport Running Shoes</h5>
                        <p class="card-text text-muted">₹3,299</p>
                        <button class="btn btn-outline-primary mt-auto">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
